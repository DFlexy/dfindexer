<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DF Indexer - Busca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2f80ff;
            --primary-dark: #1a5fd4;
            --primary-soft: rgba(47, 128, 255, 0.16);
            --glow: rgba(47, 128, 255, 0.45);
            --bg: #05070d;
            --card: #0b1220;
            --text: #d5e4ff;
            --heading: #f2f7ff;
            --muted: #7f96be;
            --line: rgba(80, 140, 255, 0.32);
            --bar: #070b14;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Rajdhani, "Segoe UI", sans-serif;
            background:
                radial-gradient(900px 420px at 8% -10%, rgba(47, 128, 255, 0.22), transparent 60%),
                radial-gradient(700px 380px at 100% 0%, rgba(20, 70, 180, 0.2), transparent 55%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(70, 130, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(70, 130, 255, 0.06) 1px, transparent 1px);
            background-size: 46px 46px;
            mask-image: linear-gradient(180deg, #000 0%, transparent 88%);
        }

        .topbar {
            background: rgba(5, 8, 16, 0.92);
            color: #fff;
            display: flex;
            align-items: center;
            gap: 18px;
            min-height: 68px;
            padding: 10px 22px;
            position: sticky;
            top: 0;
            z-index: 5;
            border-bottom: 1px solid var(--line);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45), 0 1px 0 rgba(47, 128, 255, 0.35);
            backdrop-filter: blur(8px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            color: inherit;
            text-decoration: none;
            cursor: pointer;
        }
        .brand:hover .brand-name { color: #9ec4ff; }
        .brand:hover .brand-mark { box-shadow: 0 0 18px #3d8bff; }

        .brand-mark {
            width: 36px;
            height: 36px;
            background: linear-gradient(160deg, #3d8bff, #123a86);
            color: #fff;
            display: grid;
            place-items: center;
            font-family: "Chakra Petch", Rajdhani, sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            box-shadow: 0 0 16px var(--glow);
        }

        .brand-name {
            font-family: "Chakra Petch", Rajdhani, sans-serif;
            font-weight: 700;
            color: #fff;
            font-size: 1rem;
            letter-spacing: 0.6px;
        }
        .brand-sub { color: #8eabdb; font-size: 0.78rem; margin-top: 1px; letter-spacing: 0.4px; }

        .nav { display: flex; align-items: center; gap: 4px; }
        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            color: #c5d7f5;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.98rem;
            letter-spacing: 0.3px;
            border: 1px solid transparent;
        }
        .nav-link svg { width: 16px; height: 16px; flex-shrink: 0; }
        .nav-link.active, .nav-link:hover {
            color: #fff;
            border-color: var(--line);
            background: var(--primary-soft);
            box-shadow: inset 0 0 12px rgba(47, 128, 255, 0.18);
        }

        .support-btn {
            margin-left: auto;
            background: transparent;
            color: #d7e8ff;
            text-decoration: none;
            font-weight: 700;
            letter-spacing: 0.4px;
            padding: 8px 14px;
            font-size: 0.92rem;
            white-space: nowrap;
            border: 1px solid var(--primary);
            box-shadow: 0 0 14px rgba(47, 128, 255, 0.25);
        }
        .support-btn:hover { background: var(--primary); color: #fff; }
        .support-btn { animation: apoiar-pulso 1.15s ease-in-out infinite; }
        @keyframes apoiar-pulso {
            0%, 100% {
                background: transparent;
                box-shadow: 0 0 8px rgba(47, 128, 255, 0.2);
                border-color: rgba(47, 128, 255, 0.55);
            }
            50% {
                background: var(--primary);
                color: #fff;
                box-shadow: 0 0 18px rgba(47, 128, 255, 0.85);
                border-color: #9ec4ff;
            }
        }

        .page-head { margin-bottom: 16px; }
        .page-head h1 {
            font-family: "Chakra Petch", Rajdhani, sans-serif;
            font-size: 1.45rem;
            color: var(--heading);
            font-weight: 700;
            letter-spacing: 0.8px;
        }
        .page-head p { color: var(--muted); font-size: 0.95rem; margin-top: 4px; }

        .content { padding: 24px; position: relative; z-index: 1; }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 16px;
        }
        .stat-card, .card, .result-item {
            position: relative;
            background: linear-gradient(180deg, rgba(16, 32, 62, 0.92), rgba(8, 12, 22, 0.96));
            border: 1px solid var(--line);
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55), 0 0 22px rgba(20, 70, 180, 0.12);
        }
        .stat-card::before, .card::before, .result-item::before,
        .stat-card::after, .card::after, .result-item::after {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: #6aabff;
            border-style: solid;
            pointer-events: none;
        }
        .stat-card::before, .card::before, .result-item::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
        .stat-card::after, .card::after, .result-item::after { right: -1px; bottom: -1px; border-width: 0 2px 2px 0; }
        .stat-card { padding: 10px 16px; }
        .stat-label {
            color: var(--muted);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.1;
        }
        .stat-value {
            color: #7eb6ff;
            font-family: "Chakra Petch", Rajdhani, sans-serif;
            font-size: 1.45rem;
            font-weight: 700;
            line-height: 1.15;
            margin-top: 2px;
            text-shadow: 0 0 16px rgba(47, 128, 255, 0.45);
        }
        .stat-hint { color: #9ec4ff; font-size: 0.78rem; margin-top: 2px; font-weight: 600; line-height: 1.1; }

        .card { padding: 20px; margin-bottom: 16px; }
        .card-title {
            color: var(--heading);
            font-family: "Chakra Petch", Rajdhani, sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            margin-bottom: 14px;
        }

        .search-form { display: flex; flex-direction: column; gap: 14px; }
        .form-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label, .sites-section > label {
            color: var(--heading);
            font-weight: 600;
            font-size: 0.82rem;
        }
        .input-wrapper { position: relative; }
        .form-group input {
            width: 100%;
            height: 38px;
            padding: 6px 40px 6px 14px;
            border: 1px solid var(--line);
            background: #070d18;
            color: var(--heading);
            font: inherit;
            font-size: 1.02rem;
        }
        .form-group input::placeholder { color: #6d84ab; }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: #0a1426;
            box-shadow: 0 0 0 3px rgba(47, 128, 255, 0.22);
        }
        .clear-button {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: var(--muted);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        .clear-button:hover { background: var(--primary-soft); color: var(--primary); }
        .btn-search {
            height: 38px;
            padding: 0 22px;
            border: 1px solid #6aabff;
            background: linear-gradient(180deg, #3b8cff, #1a5ed0);
            color: #fff;
            font: inherit;
            font-weight: 700;
            letter-spacing: 0.6px;
            cursor: pointer;
            box-shadow: 0 0 16px rgba(47, 128, 255, 0.35);
        }
        .btn-search:hover { background: linear-gradient(180deg, #5aa0ff, #174fae); }
        .btn-search:disabled { opacity: 0.55; cursor: not-allowed; }

        .scrapers-container {
            margin-top: 8px;
            background: rgba(5, 10, 20, 0.65);
            border: 1px solid var(--line);
            padding: 12px;
        }
        .scrapers-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .select-all-wrapper {
            margin-right: 4px;
        }
        .checkbox-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #08101c;
            border: 1px solid var(--line);
            cursor: pointer;
        }
        .checkbox-wrapper:hover { border-color: var(--primary); background: var(--primary-soft); }
        .checkbox-wrapper:has(input:checked) {
            border-color: #6aabff;
            background: rgba(47, 128, 255, 0.18);
            box-shadow: 0 0 12px rgba(47, 128, 255, 0.28);
        }
        .checkbox-wrapper input { width: 16px; height: 16px; accent-color: var(--primary); margin: 0; }
        .checkbox-wrapper label { cursor: pointer; color: var(--heading); font-size: 0.88rem; font-weight: 500; margin: 0; }

        .error {
            display: none;
            background: rgba(80, 16, 24, 0.72);
            border: 1px solid rgba(255, 110, 130, 0.45);
            color: #ffc1cb;
            padding: 12px 14px;
            margin-bottom: 16px;
            font-weight: 600;
        }
        .error.active { display: block; }

        .loading { display: none; text-align: center; padding: 28px 12px; }
        .loading.active { display: block; }
        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid var(--primary-soft);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { color: var(--muted); }

        .results { display: none; }
        .results.active { display: block; }
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--line);
        }
        .results-header h2 { font-size: 1rem; color: var(--heading); }
        .results-count { color: var(--muted); font-size: 0.85rem; }

        .result-item {
            padding: 14px;
            margin-bottom: 10px;
        }
        .result-item:hover {
            border-color: #6aabff;
            box-shadow: 0 0 18px rgba(47, 128, 255, 0.22);
        }
        .result-content { display: grid; grid-template-columns: 1.4fr 0.8fr; gap: 8px 18px; }
        .result-line { display: flex; gap: 8px; align-items: center; }
        .result-label {
            color: var(--muted);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            min-width: 92px;
            line-height: 1;
            flex-shrink: 0;
        }
        .result-value { color: var(--text); font-size: 0.88rem; word-break: break-word; line-height: 1.25; }
        .result-title { color: var(--heading); font-weight: 600; }
        .result-link { color: var(--primary); text-decoration: none; }
        .result-link:hover { text-decoration: underline; }
        .badge {
            display: inline-flex;
            align-items: center;
            height: 22px;
            padding: 0 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            line-height: 1;
            white-space: nowrap;
        }
        .badge.audio { background: var(--primary-soft); color: #9ec4ff; border: 1px solid var(--line); }
        .badge.info { background: rgba(20, 40, 80, 0.8); color: #b9d4ff; border: 1px solid var(--line); }
        .badge.info.ok { background: rgba(20, 70, 160, 0.45); color: #d6e8ff; }
        .badge.info.empty { background: rgba(90, 20, 32, 0.55); color: #ffc4ce; border-color: rgba(255, 120, 140, 0.35); }
        .badge.seed { background: rgba(14, 92, 48, 0.85); color: #b8f7cf; border: 1px solid rgba(72, 210, 120, 0.65); }
        .badge.leech { background: rgba(122, 42, 18, 0.85); color: #ffd0b4; border: 1px solid rgba(255, 146, 78, 0.6); }
        .badge.size { background: rgba(16, 78, 132, 0.85); color: #c8e8ff; border: 1px solid rgba(96, 176, 236, 0.6); }
        .badge.seed.empty, .badge.leech.empty, .badge.size.empty { opacity: 0.5; }
        .info-badges, .result-value.info-badges { display: inline-flex; flex-wrap: wrap; gap: 6px; }
        .hash-value { font-family: ui-monospace, Consolas, monospace; font-size: 0.75rem; color: var(--muted); word-break: break-all; }
        .magnet-name { font-size: 0.78rem; color: var(--text); }
        .magnet-button {
            display: inline-flex;
            align-items: center;
            height: 22px;
            background: linear-gradient(180deg, #3dce74, #178a42);
            color: #fff;
            text-decoration: none;
            padding: 0 8px;
            font-size: 0.75rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0.4px;
            border: 1px solid #8eecc0;
            border-radius: 6px;
        }
        .magnet-button:hover { background: #146e36; }
        .no-results { text-align: center; padding: 28px 10px; color: var(--muted); }
        .no-results h3 { color: var(--heading); margin-bottom: 6px; }

        .page-foot { color: var(--muted); font-size: 0.8rem; text-align: center; padding: 8px 0 12px; }
        .page-foot a { color: inherit; text-decoration: none; }
        .page-foot a:hover { color: #9ec4ff; }

        @media (max-width: 980px) {
            .stats, .result-content, .form-row { grid-template-columns: 1fr; }
            .content { padding: 16px; }
            .topbar { flex-wrap: wrap; gap: 10px; }
            .support-btn { margin-left: 0; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="https://github.com/DFlexy/dfindexer" target="_blank" rel="noopener noreferrer">
            <div class="brand-mark">DF</div>
            <div>
                <div class="brand-name">DF Indexer</div>
                <div class="brand-sub">Busca de torrents</div>
            </div>
        </a>
        <a class="support-btn" href="https://donate.stripe.com/3cI3cvehCfd18bxbPoco000" target="_blank" rel="noopener noreferrer">Apoiar projeto</a>
    </header>
    <div class="content">
        <div class="page-head">
            <h1>Busca</h1>
            <p>Torrents brasileiros para Prowlarr, Sonarr e Radarr</p>
        </div>
                <section class="stats">
                    <article class="stat-card">
                        <div class="stat-label">Indexados</div>
                        <div class="stat-value" id="indexedCountTop">...</div>
                        <div class="stat-hint">No cache</div>
                    </article>
                    <article class="stat-card">
                        <div class="stat-label">Sites</div>
                        <div class="stat-value" id="sitesCount">...</div>
                        <div class="stat-hint">Disponíveis</div>
                    </article>
                    <article class="stat-card">
                        <div class="stat-label">Resultados</div>
                        <div class="stat-value" id="resultsStat">—</div>
                        <div class="stat-hint">Última busca</div>
                    </article>
                </section>

                <section class="card">
                    <h2 class="card-title">Nova busca</h2>
                    <form id="searchForm" class="search-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="query">O que você procura?</label>
                                <div class="input-wrapper">
                                    <input type="text" id="query" name="query" placeholder="Digite o nome do filme ou série..." required>
                                    <button type="button" class="clear-button" id="clearButton" title="Limpar">×</button>
                                </div>
                            </div>
                            <button type="submit" class="btn-search" id="searchBtn">Buscar</button>
                        </div>
                        <div class="sites-section">
                            <label>Sites</label>
                            <div class="scrapers-container">
                                <div class="scrapers-grid">
                                    <div class="checkbox-wrapper select-all-wrapper">
                                        <input type="checkbox" id="selectAll">
                                        <label for="selectAll">Selecionar todos</label>
                                    </div>
                                    <div id="scrapersList" style="display: contents;"></div>
                                </div>
                            </div>
                        </div>
                    </form>
                </section>

                <div class="error" id="errorBox"></div>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p id="loadingText">Buscando torrents...</p>
                </div>

                <section class="card results" id="results">
                    <div class="results-header">
                        <h2>Resultados</h2>
                        <div class="results-count" id="resultsCount"></div>
                    </div>
                    <div id="resultsList"></div>
                </section>

                <div class="page-foot"><a href="https://github.com/DFlexy/dfindexer" target="_blank" rel="noopener noreferrer">DF Indexer</a></div>
    </div>

    <script>

        async function loadSites() {
            try {
                const response = await fetch('/');
                const data = await response.json();
                const scrapersList = document.getElementById('scrapersList');
                const selectAllCheckbox = document.getElementById('selectAll');
                const typesInfo = data.types_info || {};

                if (data.available_types && Array.isArray(data.available_types)) {
                    scrapersList.innerHTML = '';
                    const defaultScraper = data.available_types.includes('starck') ? 'starck' : data.available_types[0];
                    data.available_types.forEach((site) => {
                        const meta = typesInfo[site] || {};
                        const wrapper = document.createElement('div');
                        wrapper.className = 'checkbox-wrapper';
                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.id = `site_${site}`;
                        checkbox.value = site;
                        checkbox.name = 'scraper';
                        checkbox.dataset.useFlaresolverr = meta.use_flaresolverr_default ? 'true' : 'false';
                        if (site === defaultScraper) checkbox.checked = true;
                        const label = document.createElement('label');
                        label.htmlFor = `site_${site}`;
                        label.textContent = meta.display_name || (site.charAt(0).toUpperCase() + site.slice(1));
                        wrapper.appendChild(checkbox);
                        wrapper.appendChild(label);
                        scrapersList.appendChild(wrapper);
                    });
                    const sitesCount = document.getElementById('sitesCount');
                    if (sitesCount) sitesCount.textContent = String(data.available_types.length);
                    updateSelectAllState();
                    selectAllCheckbox.addEventListener('change', (e) => {
                        document.querySelectorAll('input[name="scraper"]').forEach(cb => cb.checked = e.target.checked);
                    });
                    scrapersList.addEventListener('change', (e) => {
                        if (e.target.name === 'scraper') updateSelectAllState();
                    });
                }
            } catch (error) {
                console.error('Erro ao carregar sites:', error);
            }
        }

        function updateSelectAllState() {
            const checkboxes = document.querySelectorAll('input[name="scraper"]');
            const selectAllCheckbox = document.getElementById('selectAll');
            const checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
            if (checkedCount === 0) {
                selectAllCheckbox.checked = false;
                selectAllCheckbox.indeterminate = false;
            } else if (checkedCount === checkboxes.length) {
                selectAllCheckbox.checked = true;
                selectAllCheckbox.indeterminate = false;
            } else {
                selectAllCheckbox.checked = false;
                selectAllCheckbox.indeterminate = true;
            }
        }

        function getSelectedScrapers() {
            const selected = Array.from(document.querySelectorAll('input[name="scraper"]:checked')).map(cb => cb.value);
            return selected;
        }

        function extractAudioTags(title) {
            const finalTitle = title.trim();
            const idiomas = [];
            if (title.includes('[Brazilian]')) idiomas.push('Português');
            if (title.includes('[Eng]')) idiomas.push('Inglês');
            if (title.includes('[Jap]')) idiomas.push('Japonês');
            return {
                finalTitle: finalTitle,
                idiomas: idiomas.slice(0, 3),
                legendas: []
            };
        }

        function determineLegenda(torrent) {
            if (torrent.legend != null && torrent.legend !== undefined && torrent.legend !== 'N/A' && String(torrent.legend).trim()) {
                return String(torrent.legend).trim();
            }
            if (torrent.has_legenda === true) {
                return 'Português';
            }
            const title = (torrent.title_processed || '').toLowerCase();
            if (title.includes('legendado') || title.includes('legenda') || /\bleg\b/.test(title)) {
                return 'Português';
            }
            const magnetOriginal = (torrent.magnet_original || '').toLowerCase();
            if (magnetOriginal.includes('legendado') || magnetOriginal.includes('legenda') || /\bleg\b/.test(magnetOriginal)) {
                return 'Português';
            }
            const magnetLink = (torrent.magnet || torrent.magnet_link || '').toLowerCase();
            if (magnetLink.includes('magnet:')) {
                try {
                    const dnMatch = magnetLink.match(/[&?]dn=([^&]+)/i);
                    if (dnMatch) {
                        const magnetName = decodeURIComponent(dnMatch[1]).toLowerCase();
                        if (magnetName.includes('legendado') || magnetName.includes('legenda') || /\bleg\b/.test(magnetName)) {
                            return 'Português';
                        }
                    }
                } catch (e) {
                    // Ignora erros de decodificação
                }
            }
            return null;
        }

        function formatSize(size) {
            return size && size !== 'N/A' ? size : 'N/A';
        }

        function formatNumber(num) {
            return (num === null || num === undefined || num === 'N/A') ? 'N/A' : num.toString();
        }

        function hasPositiveCount(value) {
            if (value === null || value === undefined || value === '' || value === 'N/A') {
                return false;
            }
            const num = Number(value);
            return !Number.isNaN(num) && num > 0;
        }

        function hasValidSize(size) {
            if (!size || size === 'N/A') {
                return false;
            }
            const normalized = String(size).trim().toLowerCase();
            return normalized !== '0' && normalized !== '0 b' && normalized !== '0b';
        }

        function formatUrl(url) {
            if (!url || url === '#') return 'N/A';
            try {
                return `${new URL(url).origin}/...`;
            } catch (e) {
                const match = url.match(/^https?:\/\/([^\/]+)/);
                return match ? `${match[0]}/...` : (url.length > 50 ? url.substring(0, 50) + '...' : url);
            }
        }

        function renderResults(torrents) {
            const resultsList = document.getElementById('resultsList');
            const resultsCount = document.getElementById('resultsCount');
            resultsCount.textContent = `${torrents.length} resultado(s) encontrado(s)`;
            const resultsStat = document.getElementById('resultsStat');
            if (resultsStat) resultsStat.textContent = torrents.length.toLocaleString('pt-BR');
            if (torrents.length === 0) {
                resultsList.innerHTML = '<div class="no-results"><h3>Nenhum resultado encontrado</h3><p>Tente buscar com outros termos ou verifique a ortografia.</p></div>';
                return;
            }
            resultsList.innerHTML = torrents.map(torrent => {
                const { finalTitle, idiomas } = extractAudioTags(torrent.title_processed || '');
                const idiomasStr = idiomas.length > 0 ? idiomas.join(', ') : 'N/A';
                const legendaDetectada = determineLegenda(torrent);
                const legendaStr = legendaDetectada || 'N/A';
                const detailsUrl = torrent.details || '#';
                const magnetLink = torrent.magnet || torrent.magnet_link || '#';
                const formattedUrl = formatUrl(detailsUrl);
                const seedRaw = torrent.tracker_seed !== undefined ? torrent.tracker_seed : torrent.seed_count;
                const leechRaw = torrent.tracker_leech !== undefined ? torrent.tracker_leech : torrent.leech_count;
                const seeds = formatNumber(seedRaw !== undefined ? seedRaw : 'N/A');
                const leech = formatNumber(leechRaw !== undefined ? leechRaw : 'N/A');
                const size = formatSize(torrent.size);
                const seedBadgeClass = hasPositiveCount(seedRaw) ? 'badge seed' : 'badge seed empty';
                const leechBadgeClass = hasPositiveCount(leechRaw) ? 'badge leech' : 'badge leech empty';
                const sizeBadgeClass = hasValidSize(torrent.size) ? 'badge size' : 'badge size empty';
                const hash = torrent.info_hash || 'N/A';
                let releaseTitleMagnet = torrent.magnet_original;
                const looksProcessedMagnet = (name) => /^-S\d{1,2}E\d{1,2}-/.test((name || '').trim()) && (name || '').split('.').length >= 4;
                if (looksProcessedMagnet(releaseTitleMagnet)) {
                    releaseTitleMagnet = null;
                }
                if (!releaseTitleMagnet && magnetLink && magnetLink !== '#') {
                    try {
                        const dnMatch = magnetLink.match(/[&?]dn=([^&]+)/i);
                        if (dnMatch) {
                            const dnValue = decodeURIComponent(dnMatch[1]);
                            if (!looksProcessedMagnet(dnValue)) {
                                releaseTitleMagnet = dnValue;
                            }
                        }
                    } catch (e) {
                        // Ignora erros de decodificação
                    }
                }
                releaseTitleMagnet = releaseTitleMagnet || 'N/A';
                return `<div class="result-item"><div class="result-content">
                    <div class="result-line"><span class="result-label">TÍTULO PROCESSADO:</span><span class="result-value result-title">${finalTitle}</span></div>
                    <div class="result-line"><span class="result-label">LINK:</span><span class="result-value">${detailsUrl !== '#' ? `<a href="${detailsUrl}" target="_blank" class="result-link" title="${detailsUrl}">${formattedUrl}</a>` : 'N/A'}</span></div>
                    <div class="result-line"><span class="result-label">ÁUDIO:</span><span class="result-value">${idiomasStr !== 'N/A' ? `<span class="badge audio">${idiomasStr}</span>` : 'N/A'}</span></div>
                    <div class="result-line"><span class="result-label">LEGENDA:</span><span class="result-value">${legendaStr !== 'N/A' ? `<span class="badge audio">${legendaStr}</span>` : 'N/A'}</span></div>
                    <div class="result-line"><span class="result-label">INFO:</span><span class="result-value info-badges"><span class="${seedBadgeClass}">S: ${seeds}</span><span class="${leechBadgeClass}">L: ${leech}</span><span class="${sizeBadgeClass}">${size}</span></span></div>
                    <div class="result-line"><span class="result-label">HASH:</span><span class="result-value hash-value">${hash}</span></div>
                    <div class="result-line"><span class="result-label">MAGNET:</span><span class="result-value magnet-name">${releaseTitleMagnet}</span></div>
                    <div class="result-line"><span class="result-label">DOWNLOAD:</span><span class="result-value">${magnetLink !== '#' ? `<a href="${magnetLink}" class="magnet-button">Magnet</a>` : 'N/A'}</span></div>
                </div></div>`;
            }).join('');
        }

        function showError(message) {
            const errorBox = document.getElementById('errorBox');
            errorBox.textContent = message;
            errorBox.classList.add('active');
            setTimeout(() => errorBox.classList.remove('active'), 5000);
        }

        function siteLabel(site) {
            const label = document.querySelector(`label[for="site_${site}"]`);
            return label ? label.textContent : site;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function fetchSiteResults(site, query, flaresolverrParam) {
            const url = `/indexers/${site}?q=${encodeURIComponent(query)}${flaresolverrParam}&wait=poll`;
            const started = Date.now();
            const maxMs = 10 * 60 * 1000;
            let failures = 0;
            while (Date.now() - started < maxMs) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    const data = await response.json();
                    failures = 0;
                    if (!data.pending) {
                        return data.results || [];
                    }
                } catch (error) {
                    failures += 1;
                    if (failures >= 5) {
                        throw error;
                    }
                }
                await sleep(2000);
            }
            throw new Error('tempo esgotado');
        }

        async function searchTorrents(query, selectedScrapers) {
            const loading = document.getElementById('loading');
            const loadingText = document.getElementById('loadingText');
            const results = document.getElementById('results');
            const searchBtn = document.getElementById('searchBtn');
            loading.classList.add('active');
            results.classList.remove('active');
            searchBtn.disabled = true;
            try {
                let scrapersToSearch = [];
                const allScrapers = Array.from(document.querySelectorAll('input[name="scraper"]')).map(cb => cb.value);

                if (selectedScrapers.length === 0 || selectedScrapers.length === allScrapers.length) {
                    scrapersToSearch = allScrapers;
                } else {
                    scrapersToSearch = selectedScrapers;
                }

                if (scrapersToSearch.length === 0) {
                    showError('Por favor, selecione pelo menos um site de busca.');
                    return;
                }

                const pending = new Set(scrapersToSearch);
                const failed = [];
                let allResults = [];

                const refreshStatus = () => {
                    const names = Array.from(pending).map(siteLabel);
                    loadingText.textContent = names.length
                        ? `Buscando em ${names.join(', ')}...`
                        : 'Buscando torrents...';
                };
                refreshStatus();

                await Promise.all(scrapersToSearch.map(async (site) => {
                    try {
                        const checkbox = document.getElementById(`site_${site}`);
                        const useFlareSolverr = checkbox?.dataset.useFlaresolverr === 'true';
                        const flaresolverrParam = useFlareSolverr ? '&use_flaresolverr=true' : '&use_flaresolverr=false';
                        const rows = await fetchSiteResults(site, query, flaresolverrParam);
                        allResults = allResults.concat(rows);
                        if (allResults.length) {
                            allResults.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
                            renderResults(allResults);
                            results.classList.add('active');
                        }
                    } catch (error) {
                        console.error(`Erro ao buscar em ${site}:`, error);
                        failed.push(siteLabel(site));
                    } finally {
                        pending.delete(site);
                        refreshStatus();
                    }
                }));

                allResults.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
                renderResults(allResults);
                if (failed.length && allResults.length === 0) {
                    const resultsList = document.getElementById('resultsList');
                    resultsList.innerHTML = `<div class="no-results"><h3>Nenhum resultado encontrado</h3><p>Estes sites não responderam: ${failed.join(', ')}.</p></div>`;
                } else if (failed.length) {
                    showError(`Estes sites não responderam: ${failed.join(', ')}.`);
                }
                results.classList.add('active');
            } catch (error) {
                showError('Erro ao buscar torrents. Tente novamente.');
                console.error('Erro:', error);
            } finally {
                loading.classList.remove('active');
                loadingText.textContent = 'Buscando torrents...';
                searchBtn.disabled = false;
            }
        }

        const queryInput = document.getElementById('query');
        const clearButton = document.getElementById('clearButton');

        function toggleClearButton() {
            clearButton.style.display = queryInput.value.trim().length > 0 ? 'flex' : 'none';
        }

        queryInput.addEventListener('input', toggleClearButton);
        clearButton.addEventListener('click', () => {
            queryInput.value = '';
            queryInput.focus();
            clearButton.style.display = 'none';
        });

        document.getElementById('searchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const query = queryInput.value.trim();
            if (!query) {
                showError('Por favor, digite um termo de busca.');
                return;
            }
            searchTorrents(query, getSelectedScrapers());
        });

        function setIndexedCount(value) {
            document.getElementById('indexedCountTop').textContent = value;
        }

        async function loadIndexedCount() {
            try {
                const response = await fetch('/');
                const data = await response.json();
                setIndexedCount((data.indexed_torrents || 0).toLocaleString('pt-BR'));
            } catch (error) {
                console.error('Erro ao carregar contagem:', error);
                setIndexedCount('N/A');
            }
        }

        loadSites();
        loadIndexedCount();
    </script>
</body>
</html>
